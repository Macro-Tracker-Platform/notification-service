spring.application.name=macro-tracker-notification-service

notification-service.url=https://macrotracker.url

spring.mail.host=host
spring.mail.port=1234
spring.mail.username=username
spring.mail.password=password

swagger.public-url=http://public.url
spring.datasource.url=jdbc:h2:mem:notifications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
services.user-service-url=http://localhost:9001
services.intake-service-url=http://localhost:9002
services.bff-service-url=http://localhost:9003
