spring.application.name=macro-tracker-notification-service

swagger.public-url=${MACRO_TRACKER_URL}

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.ssl.enabled=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

spring.kafka.listener.missing-topics-fatal=false
spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.fcm.enabled=${FCM_ENABLED:false}
app.fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
app.fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}
app.fcm.topic-prefix=${FCM_TOPIC_PREFIX:macro-tracker-cache-user-}

services.user-service-url=${USER_SERVICE_URL}
services.intake-service-url=${INTAKE_SERVICE_URL}
services.bff-service-url=${BFF_SERVICE_URL}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?tcpKeepAlive=true&sslmode=disable
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

notifications.scheduler-delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:60000}
notifications.dinner-max-meals=${NOTIFICATION_DINNER_MAX_MEALS:2}
notifications.app-version-code=${NOTIFICATION_APP_VERSION_CODE:62}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
